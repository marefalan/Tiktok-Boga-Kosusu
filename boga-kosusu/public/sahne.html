<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boğa Koşusu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  .sahne { position: relative; height: 100vh; width: calc(100vh * 9 / 16); max-width: 100vw; max-height: calc(100vw * 16 / 9); }
  .sahne canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ses { position: fixed; inset: auto 0 24px 0; margin: auto; width: max-content; padding: 14px 22px; border-radius: 999px; border: 0;
         font: 600 16px Rubik, system-ui, sans-serif; background: #fff; color: #14092B; cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  #ses[hidden] { display: none; }
</style>
</head>
<body>
<div class="sahne">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <canvas id="cv"></canvas>
</div>
<button id="ses" hidden>Müziği başlatmak için tıkla</button>
<script type="module" src="/js/sahne.js"></script>
</body>
</html>
